[package]
name = "cybar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A configurable X11 status bar scripted in Lua"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["x11", "statusbar", "lua", "desktop"]
categories = ["gui"]
exclude = ["/target", "/.build", "/dist", "**/__pycache__", "**/*.pyc"]

[features]
default = ["luajit"]
luajit = ["mlua/luajit", "mlua/vendored"]
lua54 = ["mlua/lua54", "mlua/vendored"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
cosmic-text = "0.14"
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
libc = "0.2"
mlua = { version = "0.11.4", features = ["serialize", "error-send"] }
notify = "8.0"
resvg = "0.45.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tiny-skia = "0.11.4"
unicode-segmentation = "1.12"
x11rb = { version = "0.13.2", features = ["randr", "xinput", "shape"] }
mio = { version = "1.0", features = ["os-poll", "os-ext"] }

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "Cybar contributors"
section = "x11"
depends = "$auto"
conflicts = "cybar-lua54"
assets = [
  ["target/release/cybar", "usr/bin/", "755"],
  ["examples/config.lua", "usr/share/doc/cybar/", "644"],
  ["README.md", "usr/share/doc/cybar/", "644"],
  ["LICENSE", "usr/share/doc/cybar/LICENSE", "644"],
  ["BUILD.md", "usr/share/doc/cybar/BUILD.md", "644"],
  ["docs/*.md", "usr/share/doc/cybar/docs/", "644"],
  ["assets/*.svg", "usr/share/doc/cybar/assets/", "644"],
  ["assets/*.png", "usr/share/doc/cybar/assets/", "644"],
  ["assets/README.md", "usr/share/doc/cybar/assets/README.md", "644"],
  ["assets/screenshots/*.png", "usr/share/doc/cybar/assets/screenshots/", "644"],
  ["examples/*.lua", "usr/share/doc/cybar/examples/", "644"],
  ["docs/cybar.1", "usr/share/man/man1/", "644"],
  ["completions/cybar.bash", "usr/share/bash-completion/completions/cybar", "644"],
  ["completions/_cybar", "usr/share/zsh/vendor-completions/", "644"],
  ["completions/cybar.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[package.metadata.deb.variants.lua54]
name = "cybar-lua54"
provides = "cybar"
conflicts = "cybar"
replaces = "cybar"
